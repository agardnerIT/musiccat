<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MusicCat - CD Collection{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; background: #f5f5f5; }
        header { background: #1a1a2e; color: white; padding: 1rem; }
        header h1 { font-size: 1.5rem; }
        nav a { color: #eee; text-decoration: none; margin-right: 1rem; }
        nav a:hover { color: #fff; }
        main { max-width: 1200px; margin: 0 auto; padding: 1rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: #1a1a2e; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn:hover { background: #333; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <h1>MusicCat</h1>
            <a href="/">Collection</a>
            <a href="/scan">Scan CD</a>
            <a href="/tracks">Tracks</a>
            <a href="/duplicates">Duplicates</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
