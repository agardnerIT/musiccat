<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan CD - MusicCat</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        header { background: #1a1a2e; color: white; padding: 1rem; }
        header a { color: #eee; text-decoration: none; }
        main { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #1a1a2e; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 1rem; width: 100%; margin-bottom: 0.5rem; }
        .btn:hover { background: #333; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-capture { background: #28a745; font-size: 1.25rem; font-weight: bold; padding: 1rem; }
        .btn-capture:hover { background: #218838; }
        .btn-clear { background: #dc3545; }
        .btn-clear:hover { background: #c82333; }
        .result { margin-top: 1rem; padding: 1rem; background: white; border-radius: 8px; }
        #scanner-container video { width: 100%; height: 100%; object-fit: cover; }
        #scanner-container canvas { display: none; }
        .scanner-status { text-align: center; padding: 0.75rem; border-radius: 4px; margin-bottom: 0.5rem; font-weight: bold; }
        .status-scanning { background: #fff3cd; color: #856404; }
        .status-found { background: #d4edda; color: #155724; }
        .barcode-display { font-size: 1.5rem; font-weight: bold; text-align: center; padding: 1rem; background: #e9ecef; border-radius: 4px; margin-bottom: 1rem; font-family: monospace; }
        .manual-entry { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <a href="/">&larr; Back to Collection</a>
    </header>
    <main>
        <h2>Scan CD Barcode</h2>
        <p style="color: #666; margin: 1rem 0;">Point camera at barcode, then tap "Capture" to look up.</p>
        
        <div id="scanner-container" style="width: 100%; height: 300px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 1rem;"></div>
        
        <div id="status" class="scanner-status status-scanning">Camera starting...</div>
        <div id="barcode-display" class="barcode-display">--</div>
        
        <button id="capture-btn" class="btn btn-capture" disabled>Capture</button>
        <button id="clear-btn" class="btn btn-clear" style="display: none;">Clear & Try Again</button>
        
        <div class="manual-entry">
            <p style="color: #666; margin-bottom: 0.5rem;">Or enter barcode manually:</p>
            <form id="manual-form">
                <input type="text" id="barcode-input" placeholder="Enter barcode..." style="padding: 0.75rem; width: 65%; border: 1px solid #ddd; border-radius: 4px;">
                <button type="submit" class="btn" style="width: 33%; margin-bottom: 0;">Lookup</button>
            </form>
        </div>

        <div id="result"></div>
    </main>

    <script>
        let lastScanned = null;
        let currentBarcode = null;
        let scannerRunning = false;
        
        const captureBtn = document.getElementById('capture-btn');
        const clearBtn = document.getElementById('clear-btn');
        const barcodeDisplay = document.getElementById('barcode-display');
        const statusDiv = document.getElementById('status');
        
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#scanner-container'),
                constraints: {
                    facingMode: "environment",
                    width: { min: 640, ideal: 1280, max: 1920 },
                    height: { min: 480, ideal: 720, max: 1080 },
                    aspectRatio: { min: 1, max: 2 }
                }
            },
            locator: {
                patchSize: "medium",
                halfSample: true
            },
            numOfWorkers: navigator.hardwareConcurrency || 4,
            decoder: {
                readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"]
            },
            locate: true
        }, function(err) {
            if (err) {
                console.log(err);
                document.getElementById('scanner-container').innerHTML = 
                    '<p style="color: white; text-align: center; padding: 2rem;">Camera not available on this device.<br><br>Please ensure:<br>• HTTPS is enabled (required for camera on iOS)<br>• Camera permissions are allowed<br><br><a href="#" onclick="document.getElementById(\'manual-form\').scrollIntoView(); return false;" style="color: #4da6ff;">Enter barcode manually</a></p>';
                statusDiv.textContent = 'Camera not available';
                statusDiv.className = 'scanner-status';
                return;
            }
            Quagga.start();
            scannerRunning = true;
            statusDiv.textContent = 'Point camera at barcode';
            statusDiv.className = 'scanner-status status-scanning';
        });

        Quagga.onProcessed(function(result) {
            var drawingCtx = Quagga.canvas.ctx.overlay;
            var drawingCanvas = Quagga.canvas.dom.overlay;
            if (result) {
                if (result.boxes) {
                    drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                    result.boxes.filter(function (box) {
                        return box !== result.box;
                    }).forEach(function (box) {
                        Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                    });
                }
                if (result.box) {
                    Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "blue", lineWidth: 2});
                }
                if (result.codeResult && result.codeResult.code) {
                    Quagga.ImageDebug.drawPath(result.line, {x: 0, y: 1}, drawingCtx, {color: "red", lineWidth: 3});
                    currentBarcode = result.codeResult.code;
                    barcodeDisplay.textContent = currentBarcode;
                    captureBtn.disabled = false;
                    captureBtn.textContent = 'Capture: ' + currentBarcode;
                }
            }
        });

        captureBtn.addEventListener('click', function() {
            if (currentBarcode) {
                lookupBarcode(currentBarcode);
            }
        });

        clearBtn.addEventListener('click', function() {
            currentBarcode = null;
            lastScanned = null;
            barcodeDisplay.textContent = '--';
            captureBtn.disabled = true;
            captureBtn.textContent = 'Capture';
            captureBtn.className = 'btn btn-capture';
            clearBtn.style.display = 'none';
            statusDiv.textContent = 'Point camera at barcode';
            statusDiv.className = 'scanner-status status-scanning';
            document.getElementById('result').innerHTML = '';
        });

        document.getElementById('manual-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('barcode-input').value.trim();
            if (code) {
                lookupBarcode(code);
            }
        });

        function lookupBarcode(barcode) {
            statusDiv.textContent = 'Looking up...';
            document.getElementById('result').innerHTML = '<p>Looking up barcode...</p>';
            
            fetch(`/api/lookup?barcode=${barcode}`)
                .then(r => r.json())
                .then(data => {
                    if (data.exists) {
                        showResult(data.cd, true);
                    } else if (data.mb_data) {
                        showLookupForm(data.mb_data);
                    } else {
                        showManualEntry(barcode);
                    }
                });
        }

        function showResult(cd, exists) {
            statusDiv.textContent = exists ? 'Already in collection!' : 'Found!';
            statusDiv.className = 'scanner-status status-found';
            captureBtn.className = 'btn btn-capture';
            clearBtn.style.display = 'block';
            
            document.getElementById('result').innerHTML = `
                <div class="result">
                    <h3>${exists ? 'CD Already in Collection' : 'Found!'}</h3>
                    <p><strong>${cd.title}</strong> by ${cd.artist}</p>
                    ${exists ? `<a href="/cd/${cd.id}" class="btn">View Details</a>` : ''}
                </div>
            `;
        }

        function showLookupForm(cdData) {
            statusDiv.textContent = 'Found!';
            statusDiv.className = 'scanner-status status-found';
            captureBtn.className = 'btn btn-capture';
            clearBtn.style.display = 'block';
            
            document.getElementById('result').innerHTML = `
                <div class="result">
                    <h3>Found: ${cdData.title}</h3>
                    <p>by ${cdData.artist}</p>
                    ${cdData.year ? `<p>Year: ${cdData.year}</p>` : ''}
                    ${cdData.genre ? `<p>Genre: ${cdData.genre}</p>` : ''}
                    <form id="add-form">
                        <input type="hidden" name="barcode" value="${cdData.barcode}">
                        <input type="hidden" name="title" value="${cdData.title}">
                        <input type="hidden" name="artist" value="${cdData.artist}">
                        <input type="hidden" name="year" value="${cdData.year || ''}">
                        <input type="hidden" name="genre" value="${cdData.genre || ''}">
                        <input type="hidden" name="cover_url" value="${cdData.cover_url || ''}">
                        <button type="submit" class="btn">Add to Collection</button>
                    </form>
                </div>
            `;
            
            document.getElementById('add-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(e.target);
                fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(formData))
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = `/cd/${data.cd.id}`;
                    } else if (data.exists && data.cd) {
                        showResult(data.cd, true);
                    } else {
                        alert(data.error || 'Failed to add CD');
                    }
                })
                .catch(err => {
                    alert('Failed to add CD');
                });
            });
        }

        function showManualEntry(barcode) {
            statusDiv.textContent = 'Not found';
            statusDiv.className = 'scanner-status';
            clearBtn.style.display = 'block';
            
            document.getElementById('result').innerHTML = `
                <div class="result">
                    <h3>CD Not Found</h3>
                    <form id="manual-add-form">
                        <input type="hidden" name="barcode" value="${barcode}">
                        <p><label>Title: <input type="text" name="title" required style="padding: 0.5rem; width: 100%;"></label></p>
                        <p><label>Artist: <input type="text" name="artist" required style="padding: 0.5rem; width: 100%;"></label></p>
                        <p><label>Year: <input type="number" name="year" style="padding: 0.5rem; width: 100%;"></label></p>
                        <p><label>Genre: <input type="text" name="genre" style="padding: 0.5rem; width: 100%;"></label></p>
                        <p><label>Cover URL: <input type="url" name="cover_url" style="padding: 0.5rem; width: 100%;"></label></p>
                        <button type="submit" class="btn">Add to Collection</button>
                    </form>
                </div>
            `;
            
            document.getElementById('manual-add-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(e.target);
                fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(formData))
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = `/cd/${data.cd.id}`;
                    } else {
                        alert(data.error);
                    }
                });
            });
        }
    </script>
</body>
</html>
